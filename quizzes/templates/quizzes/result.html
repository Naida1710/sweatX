{% extends "base.html" %}
{% block content %}

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card p-4 shadow border-0 text-center">
                <h2 class="mb-4">Your Recommended Program</h2>

                <h3 class="mb-3">{{ result_level }} Program</h3>

                <p><strong>Training location:</strong> {{ location }}</p>
                <p><strong>Main goal:</strong> {{ goal }}</p>
                <p><strong>Extra motivation:</strong> {{ motivation }}</p>
                <p><strong>Age range:</strong> {{ age_range }}</p>
                <p><strong>Training focus:</strong> {{ training_focus }}/100</p>

                <div class="mt-4">
                    <a href="{% url 'products' %}?category=programs" class="btn btn-dark rounded-0 px-4 py-2">
                        View Programs
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
