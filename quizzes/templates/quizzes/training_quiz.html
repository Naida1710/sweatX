{% extends "base.html" %}
{% block content %}

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card p-4 shadow border-0">
                <h2 class="text-center mb-4">Choose Your Program</h2>
                <p class="text-center text-muted mb-4">Question 1 of 1</p>

                <form method="POST">
                    {% csrf_token %}

                    <h5 class="mb-3">1. Where do you want to train?</h5>

                    <div class="custom-control custom-radio mb-3">
                        <input type="radio" id="train_home" name="location" value="home" class="custom-control-input" required>
                        <label class="custom-control-label" for="train_home">I want to train at home</label>
                    </div>

                    <div class="custom-control custom-radio mb-4">
                        <input type="radio" id="train_gym" name="location" value="gym" class="custom-control-input" required>
                        <label class="custom-control-label" for="train_gym">I want to train at a gym</label>
                    </div>

                    <button type="submit" class="btn btn-dark btn-block rounded-0">
                        Continue
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
