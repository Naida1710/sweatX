{% extends "account/auth_base.html" %}
{% load i18n %}

{% block extra_css %}
<style>
       body {
        background:  !important;
        background-image: none !important;
        height: auto !important;
        min-height: 100vh;
    }

    .logout-page {
        min-height: calc(100vh - 164px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 0;
    }

    .logout-card {
        background: rgba(255,255,255,0.92);
        box-shadow: 0 15px 40px rgba(0,0,0,0.18);
        padding: 3rem 2rem;
        text-align: center;
        max-width: 560px;
        margin: 0 auto;
    }

    .logout-icon {
        width: 80px;
        height: 80px;
        margin: 0 auto 1.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #F527A9, #FF79C6);
        color: #fff;
        font-size: 1.75rem;
        box-shadow: 0 10px 24px rgba(245,39,169,0.25);
    }

    .logout-card h2 {
        text-transform: uppercase;
        letter-spacing: .08em;
    }

    .logout-actions .btn {
        min-width: 160px;
        min-height: 48px;
        text-transform: uppercase;
        font-weight: 700;
        letter-spacing: .04em;
    }

    @media (max-width: 991px) {
        .logout-page {
            min-height: calc(100vh - 116px);
            padding: 2rem 0;
        }

        .logout-card {
            padding: 2rem 1.5rem;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="container header-container logout-page">
    <div class="row justify-content-center w-100">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="logout-card">
                <div class="logout-icon">
                    <i class="fas fa-sign-out-alt"></i>
                </div>

                <h2 class="logo-font mb-3">Log Out</h2>
                <p class="text-muted mb-4">Are you sure you want to log out from your sweatX account?</p>

                <form method="POST" action="{% url 'account_logout' %}">
                    {% csrf_token %}
                    <div class="logout-actions d-flex flex-column flex-sm-row justify-content-center">
                        <a href="{% url 'home' %}" class="btn btn-outline-black mb-3 mb-sm-0 mr-sm-2">
                            Cancel
                        </a>
                        <button type="submit" class="btn btn-black ml-sm-2">
                            Logout
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
